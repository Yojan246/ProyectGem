<div *ngFor="let operador of operadores" class="bg-white rounded-xl shadow-md p-5 border border-gray-200">
  <div class="flex items-center mb-4">
    <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 text-xl font-bold">
      {{ operador.nombre.charAt(0) }}
    </div>
    <div class="ml-4">
      <h2 class="text-lg font-semibold text-gray-800">{{ operador.nombre }}</h2>
    </div>
  </div>

  <ul class="text-sm text-gray-700 space-y-1">
    <li><strong>Licencia:</strong> {{ operador.licencia }}</li>
    <li><strong>Fecha de Nacimiento:</strong> {{ operador.fechaNacimiento }}</li>
    <li><strong>Correo:</strong> {{ operador.correo }}</li>
    <li><strong>CURP:</strong> {{ operador.curp }}</li>
    <li><strong>Teléfono:</strong> {{ operador.telefono }}</li>
  </ul>

  <!-- Botones -->
  <div class="mt-4 flex space-x-3 items-center">
    <!-- Cargar DEO -->
    <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm">
      📤 Cargar DEO
      <input type="file" accept=".pdf" (change)="cargarDEO($event, operador)" hidden>
    </label>

    <!-- Descargar DEO -->
    <button
      class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded text-sm"
      (click)="descargarDEO(operador)"
      [disabled]="!operador.deoUrl"
    >
      📥 Descargar DEO
    </button>
  </div>
</div>
